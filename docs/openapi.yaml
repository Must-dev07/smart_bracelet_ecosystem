openapi: 3.0.3
info:
  title: Smart Bracelet Newborn Monitoring API
  version: 1.0.0
  description: 'REST API for the newborn vitals monitoring ecosystem. IMPORTANT: this
    system flags abnormal readings for caregiver or medical follow-up. It does NOT
    provide medical diagnoses.'
paths:
  /api/v1/alerts/:
    get:
      operationId: v1_alerts_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertList'
          description: ''
  /api/v1/alerts/{id}/:
    get:
      operationId: v1_alerts_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Alert'
          description: ''
  /api/v1/alerts/{id}/acknowledge/:
    post:
      operationId: v1_alerts_acknowledge_create
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/alerts/report-ble-lost/:
    post:
      operationId: v1_alerts_report_ble_lost_create
      description: |-
        The mobile app observes BLE link loss and reports it here (the backend
        itself cannot see the BLE link).
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login:
    post:
      operationId: v1_auth_login_create
      tags:
      - v1
      security:
      - jwtAuth: []
