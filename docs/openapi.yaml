components:
  schemas:
    Alert:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        baby:
          type: integer
          readOnly: true
        baby_name:
          type: string
          readOnly: true
        bracelet:
          type: integer
          readOnly: true
          nullable: true
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          readOnly: true
        severity:
          allOf:
          - $ref: '#/components/schemas/SeverityEnum'
          readOnly: true
        message:
          type: string
          readOnly: true
        value:
          type: number
          format: double
          readOnly: true
          nullable: true
        triggered_at:
          type: string
          format: date-time
          readOnly: true
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        acknowledged_by:
          type: integer
          readOnly: true
          nullable: true
        acknowledged_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        disclaimer:
          type: string
          readOnly: true
      required:
      - acknowledged_at
      - acknowledged_by
      - baby
      - baby_name
      - bracelet
      - disclaimer
      - id
      - message
      - resolved_at
      - severity
      - triggered_at
      - type
      - value
    Baby:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        birth_date:
          type: string
          format: date
        weight_grams:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Birth/current weight in grams
        gender:
          $ref: '#/components/schemas/GenderEnum'
        parent:
          type: integer
          readOnly: true
        parent_name:
          type: string
          readOnly: true
          default: ''
        assigned_doctor:
          type: integer
          nullable: true
        medical_history:
          type: array
          items:
            $ref: '#/components/schemas/MedicalHistoryEntry'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - birth_date
      - created_at
      - id
      - medical_history
      - name
      - parent
      - parent_name
      - weight_grams
    Bracelet:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        serial_number:
          type: string
          maxLength: 64
        firmware_version:
          type: string
          maxLength: 32
        baby:
          type: integer
          readOnly: true
          nullable: true
        baby_name:
          type: string
          readOnly: true
        battery_level:
          type: number
          format: double
          nullable: true
        last_seen_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/BraceletStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - baby
      - baby_name
      - created_at
      - id
      - last_seen_at
      - serial_number
    BraceletStatusEnum:
      enum:
      - active
      - inactive
      - maintenance
      type: string
      description: |-
        * `active` - Active
        * `inactive` - Inactive
        * `maintenance` - Maintenance
    ChannelEnum:
      enum:
      - push
      - sms
      - email
      type: string
      description: |-
        * `push` - Push
        * `sms` - Sms
        * `email` - Email
    Doctor:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          $ref: '#/components/schemas/UserSummary'
        license_number:
          type: string
          maxLength: 64
        specialty:
          type: string
          maxLength: 128
      required:
      - id
      - license_number
      - user
    GenderEnum:
      enum:
      - male
      - female
      - unspecified
      type: string
      description: |-
        * `male` - Male
        * `female` - Female
        * `unspecified` - Unspecified
    MedicalHistoryEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 200
        details:
          type: string
        recorded_by:
          type: integer
