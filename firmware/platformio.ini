; PlatformIO configuration — Smart Bracelet firmware (ESP32)
;
; Build on your machine:
;   pio run                      # compile
;   pio run -t upload            # flash over USB
;   pio device monitor -b 115200 # serial logs
;
; Host-side logic tests (no hardware needed) live in test_host/ and are
; compiled with plain g++ — see README.md.

[env:esp32dev]
platform = espressif32@6.7.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    ; MAX30102 pulse-oximeter driver
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
    ; MPU6050 accelerometer/gyro
    electroniccats/MPU6050@^1.0.0
    ; DS18B20 skin temperature probe
    paulstoffregen/OneWire@^2.3.8
    milesburton/DallasTemperature@^3.11.0
