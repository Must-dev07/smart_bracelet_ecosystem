name: bracelet_monitor
description: Smart Bracelet Newborn Monitoring — parent mobile app. Flags abnormal readings for caregiver/medical follow-up. Not a diagnostic medical device.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # State / DI
  flutter_riverpod: ^2.5.1
  # Networking
  http: ^1.2.1
  # BLE
  flutter_blue_plus: ^1.32.7
  # Charts
  fl_chart: ^0.68.0
  # Local persistence (offline-first measurement queue + cache)
  sqflite: ^2.3.3
  path: ^1.9.0
  # Secure JWT storage
  flutter_secure_storage: ^9.2.2
  # Push notifications
  firebase_core: ^3.1.0
  firebase_messaging: ^15.0.1
  flutter_local_notifications: ^17.1.2
  # Settings persistence (theme/language/units/BLE preference)
  shared_preferences: ^2.3.2
  # Utils
  intl: 0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
